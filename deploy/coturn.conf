# OpenPlay coturn configuration with ephemeral REST HMAC-SHA1 credentials
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=openplay-coturn-dev-hmac-secret
realm=openplay.local
total-quota=100
stale-nonce=600
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# Block private network relay ranges to prevent SSRF via TURN relay
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
log-file=stdout
