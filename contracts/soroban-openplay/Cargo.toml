[package]
name = "soroban-openplay"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenPlay Soroban Smart Contract on Stellar Blockchain: Cloud GPU streaming micro-billing, compute pool & tournament payouts"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
