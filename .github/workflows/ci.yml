name: OpenPlay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-ts:
    name: TypeScript & PWA Build + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build packages & PWA client
        run: pnpm -r build

      - name: Run unit & integration tests
        run: pnpm -r test

  go-node:
    name: Go 1.23 Federated Node Vet & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/node/go.mod

      - name: Download dependencies and tidy
        run: go mod tidy

      - name: Run go vet
        run: go vet ./...

      - name: Run go test with race detector
        run: go test -v -race ./...

  rust-wasm:
    name: Rust SDK & Wasm Games Test + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Cargo workspace unit tests
        run: cargo test --workspace

      - name: Build Pong and Arena for wasm32-unknown-unknown
        run: |
          cargo build -p pong --target wasm32-unknown-unknown --release
          cargo build -p arena --target wasm32-unknown-unknown --release

  e2e:
    name: Playwright End-to-End Verification
    runs-on: ubuntu-latest
    needs: [node-ts]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build monorepo
        run: pnpm -r build

      - name: Run Playwright E2E suite
        run: pnpm e2e
